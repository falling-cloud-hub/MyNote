<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8c5a"/>
      <stop offset="100%" stop-color="#3d6b3c"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#bg)"/>
  <!-- 白色书页 -->
  <rect x="28" y="22" width="52" height="64" rx="6" fill="#ffffff" opacity="0.95"/>
  <!-- 书页内横线 -->
  <line x1="38" y1="38" x2="70" y2="38" stroke="#5b8c5a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="38" y1="48" x2="64" y2="48" stroke="#5b8c5a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="38" y1="58" x2="68" y2="58" stroke="#5b8c5a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- 左下角 M 字母 -->
  <text x="46" y="76" font-family="Georgia,serif" font-size="28" font-weight="900" fill="#5b8c5a" text-anchor="middle">M</text>
  <!-- 右上角AI星形 -->
  <polygon points="85,18 88,28 98,28 90,34 93,44 85,38 77,44 80,34 72,28 82,28" fill="url(#star)" opacity="0.95"/>
  <!-- 云端弧线 -->
  <path d="M92,68 Q92,60 98,58 Q104,56 104,62 Q108,62 108,68 Z" fill="#ffffff" opacity="0.3"/>
</svg>
