<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#3d6b3c"/>
      <stop offset="50%" stop-color="#5b8c5a"/>
      <stop offset="100%" stop-color="#7aaf6d"/>
    </linearGradient>
    <linearGradient id="accentDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <!-- 书页图标 -->
  <rect x="2" y="10" width="24" height="30" rx="5" fill="url(#logoGrad)" opacity="0.15"/>
  <rect x="6" y="14" width="16" height="22" rx="3" fill="url(#logoGrad)" opacity="0.8"/>
  <line x1="9" y1="20" x2="19" y2="20" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="9" y1="24" x2="17" y2="24" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="9" y1="28" x2="18" y2="28" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- My 文字 -->
  <text x="34" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#3d3525" letter-spacing="-0.5">My</text>
  <!-- Note 文字 -->
  <text x="73" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="900" fill="url(#logoGrad)" letter-spacing="-0.5">Note</text>
  <!-- 下划线装饰 -->
  <line x1="73" y1="40" x2="148" y2="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- AI 点缀圆点 -->
  <circle cx="164" cy="16" r="4" fill="url(#accentDot)" opacity="0.85"/>
</svg>
